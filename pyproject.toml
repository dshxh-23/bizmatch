[project]
name = "bizmatch"
version = "0.1.0"
description = "A machine learning pipeline for identifying matching business entities across noisy, heterogeneous data sources."
readme = "docs/README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "tabulate>=0.10.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
